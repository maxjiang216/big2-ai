# Rust workspace tests (make test) + Python formatting (black --check).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Black
        # Pin so `black --check` matches local/dev installs (unpinned pip drifts).
        run: pip install black==23.3.0

      - name: Check Python formatting
        run: python -m black --check --diff .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: make test
